<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typing animation preview</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1f2328;--muted:#59636e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 6px} p{color:var(--muted);margin:0 0 20px;font-size:14px}
.panel{border:1px solid #8884;border-radius:8px;padding:16px 8px;margin-bottom:16px;overflow-x:auto;text-align:center}
.panel img{max-width:none;display:inline-block}
.dark{background:#0d1117} .light{background:#ffffff}
.label{font-size:12px;color:var(--muted);margin:0 0 6px}
</style></head><body><main>
<h1>Typing animation preview</h1>
<p>Same SVG as the code I gave you, loaded as an image like GitHub does. The loop takes about 18 seconds.</p>
<div class="label">GitHub dark mode</div>
<div class="panel dark"><img alt="dark preview" src="data:image/svg+xml;base64,"></div>
<div class="label">GitHub light mode</div>
<div class="panel light"><img alt="light preview" src="data:image/svg+xml;base64,"></div>
</main></body></html>
