<svg xmlns="http://www.w3.org/2000/svg" width="720" height="100" viewBox="0 0 720 100">
<style>
.t,.c{fill:#E8DCC8}
@media (prefers-color-scheme: light){.t,.c{fill:#3b3222}}
.a0{animation:w0 18s infinite}
.a1{animation:w1 18s infinite}
.a2{animation:w2 18s infinite}
.k{animation:m 18s infinite}
.b{animation:bl 1s steps(1) infinite}
@keyframes bl{0%{opacity:1}50%{opacity:0}}
@keyframes w0{0%{width:0;animation-timing-function:steps(15)}13.33%{width:210px}25%{width:210px;animation-timing-function:steps(15)}31.67%,100%{width:0}}
@keyframes w1{0%,33.33%{width:0;animation-timing-function:steps(27)}46.67%{width:378px}58.33%{width:378px;animation-timing-function:steps(27)}65%,100%{width:0}}
@keyframes w2{0%,66.67%{width:0;animation-timing-function:steps(48)}80%{width:672px}91.67%{width:672px;animation-timing-function:steps(48)}98.33%,100%{width:0}}
@keyframes m{
0%{transform:translateX(0);animation-timing-function:steps(15)}
13.33%{transform:translateX(210px)}
25%{transform:translateX(210px);animation-timing-function:steps(15)}
31.67%,33.33%{transform:translateX(0);animation-timing-function:steps(27)}
46.67%{transform:translateX(378px)}
58.33%{transform:translateX(378px);animation-timing-function:steps(27)}
65%,66.67%{transform:translateX(0);animation-timing-function:steps(48)}
80%{transform:translateX(672px)}
91.67%{transform:translateX(672px);animation-timing-function:steps(48)}
98.33%,100%{transform:translateX(0)}
}
.run{animation:run 9s linear infinite}
.black{animation-delay:-.6s}
@keyframes run{from{transform:translateX(-60px)}to{transform:translateX(730px)}}
.fa{animation:fa .4s steps(1) infinite}
.fb{animation:fb .4s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
</style>
