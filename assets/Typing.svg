<svg xmlns="http://www.w3.org/2000/svg" width="720" height="50" viewBox="0 0 720 50">
<style>@font-face{font-family:"PS2P";src:url(data:font/woff;base64,) format("woff")}
.t{font-family:"PS2P","Courier New",monospace;font-size:14px;fill:#E8DCC8;stroke:#E8DCC8;stroke-width:.7px;paint-order:stroke}
.c{fill:#E8DCC8}
@media (prefers-color-scheme: light){.t{fill:#3b3222;stroke:#3b3222}.c{fill:#3b3222}}
.k{animation:m 18s infinite}.b{animation:bl 1s steps(1) infinite}
.a0{animation:w0 18s infinite}
.a1{animation:w1 18s infinite}
.a2{animation:w2 18s infinite}
@keyframes bl{0%{opacity:1}50%{opacity:0}}
@keyframes w0{0%{width:0;animation-timing-function:steps(15)}13.33%{width:210px}25%{width:210px;animation-timing-function:steps(15)}31.67%,100%{width:0}}
@keyframes w1{0%,33.33%{width:0;animation-timing-function:steps(27)}46.66%{width:378px}58.33%{width:378px;animation-timing-function:steps(27)}65.0%,100%{width:0}}
@keyframes w2{0%,66.67%{width:0;animation-timing-function:steps(48)}80.0%{width:672px}91.67%{width:672px;animation-timing-function:steps(48)}98.34%,100%{width:0}}
@keyframes m{0%{transform:translateX(0);animation-timing-function:steps(15)}13.33%{transform:translateX(210px)}25%{transform:translateX(210px);animation-timing-function:steps(15)}31.67%,33.33%{transform:translateX(0);animation-timing-function:steps(27)}46.66%{transform:translateX(378px)}58.33%{transform:translateX(378px);animation-timing-function:steps(27)}65.0%,66.67%{transform:translateX(0);animation-timing-function:steps(48)}80.0%{transform:translateX(672px)}91.67%{transform:translateX(672px);animation-timing-function:steps(48)}98.34%,100%{transform:translateX(0)}}</style>
<defs>
<clipPath id="c0"><rect class="a0" x="8" y="0" width="0" height="50"/></clipPath>
<clipPath id="c1"><rect class="a1" x="8" y="0" width="0" height="50"/></clipPath>
<clipPath id="c2"><rect class="a2" x="8" y="0" width="0" height="50"/></clipPath>
</defs>
<g clip-path="url(#c0)"><text class="t" x="8" y="32">HI, I'M THEO...</text></g>
<g clip-path="url(#c1)"><text class="t" x="8" y="32">COMPUTER SCIENCE STUDENT...</text></g>
<g clip-path="url(#c2)"><text class="t" x="8" y="32">LEARNING DATA ENGINEERING, MACHINE LEARNING &amp; AI</text></g>
<g class="b"><rect class="c k" x="8" y="17" width="9" height="16"/></g>
</svg>
